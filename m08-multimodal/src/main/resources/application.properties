spring.application.name=m08-multimodal
server.port=8089

spring.ai.openai.api-key=${OPENAI_API_KEY}
# gpt-4o-mini acepta imágenes como entrada
spring.ai.openai.chat.options.model=gpt-4o-mini
spring.ai.openai.audio.transcription.options.model=gpt-4o-mini-transcribe
spring.ai.openai.audio.transcription.options.language=es
spring.ai.openai.audio.speech.options.model=gpt-4o-mini-tts
spring.ai.openai.audio.speech.options.voice=alloy
spring.ai.openai.image.options.model=gpt-image-1-mini
spring.ai.openai.image.options.quality=low
spring.ai.openai.image.options.size=1024x1024

# Límites de subida: protegen costo y memoria
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# Modelo para el análisis visual de reclamos (ver README: gpt-4o-mini no detectó una línea de 6 px; gpt-4o sí)
claims.vision-model=gpt-4o
