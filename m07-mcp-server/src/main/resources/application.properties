spring.application.name=m07-mcp-server
server.port=8087
# Solo escucha en la máquina local
server.address=127.0.0.1

spring.ai.mcp.server.name=acme-catalog
spring.ai.mcp.server.version=1.0.0
spring.ai.mcp.server.protocol=STREAMABLE
spring.ai.mcp.server.instructions=Catálogo de productos y políticas de Acme.

# Token que deben enviar los clientes en "Authorization: Bearer ...". Defínelo en el entorno.
acme.mcp.token=${ACME_MCP_TOKEN}
