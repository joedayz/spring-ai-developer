spring.application.name=m06-tool-calling
server.port=8086

spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.chat.options.model=gpt-4o-mini
spring.ai.openai.chat.options.temperature=0

spring.datasource.url=jdbc:h2:mem:acme;DB_CLOSE_DELAY=-1
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# Servicio de transportista (en la demo es un endpoint de esta misma app)
carrier.base-url=http://localhost:8086/fake-carrier

# Nombres extra de tools que requieren confirmación (además de @Tool(requiresConfirmation=true))
