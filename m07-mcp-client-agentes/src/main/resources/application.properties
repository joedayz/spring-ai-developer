spring.application.name=m07-mcp-client-agentes
server.port=8088

spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.chat.options.model=gpt-4o-mini

# Servidor MCP de Acme (módulo m07-mcp-server)
spring.ai.mcp.client.streamable-http.connections.acme.url=http://127.0.0.1:8087
spring.ai.mcp.client.request-timeout=30s
acme.mcp.token=${ACME_MCP_TOKEN}
