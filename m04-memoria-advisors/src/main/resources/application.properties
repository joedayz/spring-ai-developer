spring.application.name=m04-memoria-advisors
server.port=8084
spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.chat.options.model=gpt-4o-mini

# Sesiones persistentes: H2 en archivo, sobrevive a reinicios
spring.datasource.url=jdbc:h2:file:./data/sessions
spring.ai.session.repository.jdbc.initialize-schema=always
spring.ai.session.time-to-live=7d

# Compactación con resumen del cliente /safe
course.summary.max-turns=6
course.summary.keep-turns=2

logging.level.org.springframework.ai.chat.client.advisor=DEBUG
