spring.application.name=m09-produccion
server.port=8090

spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.chat.options.model=gpt-4o-mini
spring.ai.openai.chat.options.temperature=0.2
spring.ai.openai.chat.options.max-completion-tokens=300

# Resiliencia: el cliente de OpenAI reintenta errores transitorios (429, 5xx, red) con backoff
spring.ai.openai.max-retries=2
spring.ai.openai.timeout=20s

# Observabilidad: métricas gen_ai.* y trazas de cada llamada.
# NUNCA actives log-prompt/log-completion en producción: escriben datos del usuario en los logs.
spring.ai.chat.client.observations.log-prompt=false
spring.ai.chat.observations.log-prompt=false
spring.ai.chat.observations.log-completion=false
management.endpoints.web.exposure.include=health,metrics,prometheus
management.metrics.tags.application=${spring.application.name}

# Controles de costo
acme.budget.daily-tokens=20000
acme.cache.max-entries=500
acme.cache.ttl=PT1H
